version: '3.8'

services:
  bot:
    build: .
    volumes:
      - .:/app
      - downloads_data:/app/downloads
    env_file:
      - .env
    environment:
      - USE_LOCAL_API=True
      - LOCAL_API_SERVER_URL=http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api
    networks:
      - bot-network

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - downloads_data:/app/downloads
    command: --local --api-id=${TELEGRAM_API_ID} --api-hash=${TELEGRAM_API_HASH} --dir=/app/downloads
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  downloads_data:
